name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Weekly absolute supply-chain scan of main. PR scans run in OSV diff mode
  # (only vulnerabilities a PR introduces fail it), so this is what surfaces an
  # advisory that lands against already-merged dependencies. Runs after
  # Renovate's Monday lockfile maintenance window (before 4am ET).
  schedule:
    - cron: "0 13 * * 1" # Mondays 09:00 America/New_York (13:00 UTC)

jobs:
  lint:
    name: Lint
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run tests
        run: cargo test

  # Runs on every event. On pull_request the reusable workflow scans in OSV
  # diff mode; on push and schedule it runs the absolute OSV scan + cargo-deny advisories.
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@9f6bdfe7ee10489a9dd82ac1c566ddaac8cd61e6 # v1.4.0
    with:
      cargo-deny: true
    secrets: inherit

  # The organization's shared publish workflow: pushes to GHCR (latest, semver,
  # sha), signs with cosign and attaches an SPDX SBOM and build provenance.
  image:
    needs: [lint, test, supply-chain]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: chainringlabs/ci/.github/workflows/docker-publish.yml@9f6bdfe7ee10489a9dd82ac1c566ddaac8cd61e6 # v1.4.0
